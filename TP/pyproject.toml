[tool.ruff]
# Configuration de base pour le linter
line-length = 88
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
markers = [
    "performance: marks tests as performance tests (deselect with '-m \"not performance\"')",
]
pythonpath = ["src"]
testpaths = ["tests"]